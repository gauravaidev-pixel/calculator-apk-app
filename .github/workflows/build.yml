name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create myapp com.calc.app Calculator
          cd myapp
          cordova platform add android
          cp ../index.html www/index.html
          cordova build android --release
          mkdir -p ../dist
          cp platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk ../dist/calculator.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CalculatorAPK
          path: dist/calculator.apk
