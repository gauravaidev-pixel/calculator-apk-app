name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Web App with Cordova
        run: |
          npm install -g cordova
          cordova create myapp com.calc.app Calculator
          cd myapp
          cordova platform add android@11.0.0
          cp ../index.html www/index.html
          cordova build android --release
          cp platforms/android/app/build/outputs/apk/release/app-release-unsigned.apk ../calculator.apk

      - name: Release APK with GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "calculator.apk"
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v1.${{ github.run_number }}
          allowUpdates: true
          replacesExisting: true
