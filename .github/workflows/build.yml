name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Web App APK using Ionic/Capacitor or pure Gradle or simple HTML
        run: |
          npm install -g @ionic/cli @capacitor/cli
          ionic start myApp blank --type=angular --no-git --no-npm
          cd myApp
          npm install
          npx cap add android
          cp ../index.html android/app/src/main/assets/public/index.html
          npx cap build android --release
